name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create empty sklearn_docs collection in Qdrant
        run: |
          # Wait for Qdrant service to accept requests
          for i in 1 2 3 4 5; do
            curl -sf http://localhost:6333/ > /dev/null && break
            sleep 2
          done
          # Create collection so app.lifespan can wire the retriever
          curl -X PUT "http://localhost:6333/collections/sklearn_docs" \
            -H "Content-Type: application/json" \
            -d '{"vectors": {"size": 384, "distance": "Cosine"}}'

      - name: Run tests
        env:
          # Only api_key is required by app.config.Settings — everything
          # else has a sensible default in app/config.py.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'dummy-for-mocked-tests' }}
          QDRANT_URL: http://localhost:6333
        run: pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rag-app:${{ github.sha }} .
