name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rag-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Ensure mentoring-net exists (idempotent)
            docker network create mentoring-net 2>/dev/null || true

            # Ensure qdrant_data host dir exists
            mkdir -p /opt/qdrant_data /opt/rag-service

            # Write .env from secrets on every deploy.
            # Only true secrets live here. Model name, base URL, qdrant
            # URL, top_k, embedding model — all default in app/config.py
            # and are overridable via env if you ever need to.
            cat > /opt/rag-service/.env <<EOF
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            QDRANT_URL=http://qdrant:6333
            EOF
            chmod 600 /opt/rag-service/.env

            docker pull ${{ env.IMAGE }}:latest

            # Replace the running container atomically.
            # No volume for /app/data — about.md is baked into the image,
            # corpus_chunks.jsonl is regenerated on each reindex inside
            # the container. Vector data lives only in the qdrant volume.
            docker rm -f rag-app 2>/dev/null || true
            docker run -d \
              --name rag-app \
              --network mentoring-net \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              --env-file /opt/rag-service/.env \
              ${{ env.IMAGE }}:latest

            # Wait until /health responds. Cold-start can take 60-90s
            # because lifespan downloads the multilingual-e5-small model
            # (~118 MB) from HuggingFace Hub on the first run.
            for i in $(seq 1 40); do
              if curl -sf http://127.0.0.1:8000/health > /dev/null; then
                echo "Service healthy after ${i} checks"
                exit 0
              fi
              echo "Waiting for /health... ($i/40)"
              sleep 5
            done

            echo "Service failed to become healthy after 200s"
            docker logs --tail 80 rag-app
            exit 1
